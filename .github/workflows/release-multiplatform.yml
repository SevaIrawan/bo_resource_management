name: Release multi-platform

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis (kosongkan = package.json)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Write org .env from secret
        shell: bash
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then
            echo "ORG_ENV_FILE secret missing — skip (build may fail validate-org-env)"
            exit 0
          fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs

      - name: Build Windows installer
        run: npm run build:installer:win
        env:
          GH_TOKEN: ''

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/win-unpacked/**

  build-mac:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: Write org .env from secret
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -n "$ORG_ENV_FILE" ]; then
            echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
            node scripts/validate-org-env.mjs
          fi

      - name: Build macOS installer
        run: npm run build:installer:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
          GH_TOKEN: ''

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
            release/mac/**
            release/mac-arm64/**
            release/mac-x64/**

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libfuse2 fuse libgtk-3-0 libnss3

      - name: Install dependencies
        run: npm ci

      - name: Write org .env from secret
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -n "$ORG_ENV_FILE" ]; then
            echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
            node scripts/validate-org-env.mjs
          fi

      - name: Build Linux installer
        run: npm run build:installer:linux
        env:
          GH_TOKEN: ''

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml
            release/linux-unpacked/**

  publish:
    needs: [build-win, build-mac, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge installer assets (Win + Mac + Linux)
        run: |
          set -e
          mkdir -p release
          merge_platform() {
            local dir="$1"
            [ -d "$dir" ] || return 0
            shopt -s nullglob
            for pattern in \
              '*.exe' '*.exe.blockmap' 'latest.yml' \
              '*.dmg' '*.dmg.blockmap' 'latest-mac.yml' \
              '*.AppImage' 'latest-linux.yml'; do
              for f in "$dir"/$pattern; do
                cp -v "$f" release/
              done
            done
          }
          merge_platform artifacts/release-win
          merge_platform artifacts/release-mac
          merge_platform artifacts/release-linux
          echo "==> Release assets:"
          ls -la release/
          test -f release/latest.yml || (echo "ERROR: missing latest.yml (Windows)" && exit 1)
          test -f release/latest-mac.yml || (echo "ERROR: missing latest-mac.yml (macOS)" && exit 1)
          test -f release/latest-linux.yml || (echo "ERROR: missing latest-linux.yml (Linux)" && exit 1)

      - name: Resolve version tag
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (auto-update semua platform)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Resource Management ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/*.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
            release/*.AppImage
            release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
