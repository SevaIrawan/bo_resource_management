name: Release multi-platform

# Otomatis HANYA saat version di package.json berubah. Wajib secret ORG_ENV_FILE.
# Lihat docs/RELEASE-CI.md
on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/release-multiplatform.yml'
      - '.github/FORCE_REBUILD_*'
      - 'scripts/**'
      - 'electron/**'
      - 'src/**'
      - 'resources/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa build ulang meski release sudah ada'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate rilis
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_ORG_ENV: ${{ secrets.ORG_ENV_FILE != '' }}
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$HAS_ORG_ENV" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORG_ENV_FILE tidak terbaca di gate (fork PR?). Cek secret di Settings → Actions."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Force rebuild $TAG"
            exit 0
          fi

          if ls .github/FORCE_REBUILD_* 1>/dev/null 2>&1; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Force rebuild $TAG (trigger file)"
            exit 0
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG sudah ada — skip."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Will build and publish $TAG"
          fi

  build-win:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Prepare winCodeSign cache (electron-builder #8149)
        shell: pwsh
        run: ./scripts/prepare-win-codesign-cache.ps1
      - name: Write org .env (wajib)
        shell: bash
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then
            echo "::error::ORG_ENV_FILE secret kosong"
            exit 1
          fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs
      - run: npm run build:installer:win
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe

  build-mac:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Write org .env (wajib)
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then
            echo "::error::ORG_ENV_FILE secret kosong"
            exit 1
          fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs
      - run: npm run build:installer:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.zip

  build-linux:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 fuse libgtk-3-0 libnss3
      - run: npm ci
      - name: Write org .env (wajib)
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then
            echo "::error::ORG_ENV_FILE secret kosong"
            exit 1
          fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs
      - run: npm run build:installer:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage

  publish:
    needs: [gate, build-win, build-mac, build-linux]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge & validasi upload
        run: |
          set -e
          mkdir -p release
          for dir in artifacts/release-win artifacts/release-mac artifacts/release-linux; do
            [ -d "$dir" ] && cp -v "$dir"/* release/ 2>/dev/null || true
          done
          node scripts/prepare-github-release-assets.mjs release
          node scripts/validate-release-upload.mjs release
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: Resource Management ${{ needs.gate.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/latest.yml
            release/latest-mac.yml
            release/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
