<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GM Apps — Wireframe v1.0.30</title>
  <style>
:root {
  --color-bg-base: #07060f;
  --color-bg-shell: #0c0b16;
  --color-bg-card: #12101f;
  --color-bg-content-shell: rgba(18, 16, 31, 0.52);
  --color-bg-content-body: rgba(7, 6, 15, 0.38);
  --color-bg-content-header: #141226;
  --color-bg-nested-panel: #12101f;
  --color-bg-input: #eef1f8;
  --color-bg-hover: #1a1830;
  --color-bg-active: #252243;
  --color-border: #2a2744;
  --color-border-subtle: #1e1c32;
  --color-text-primary: #f4f4f8;
  --color-text-secondary: #a8a4c0;
  --color-text-muted: #6b6788;
  --color-accent: #6366f1;
  --color-accent-hover: #5558e3;
  --color-accent-glow: rgba(99, 102, 241, 0.25);
  --color-wa: #25d366;
  --color-wa-glow: rgba(37, 211, 102, 0.12);
  --color-tg: #3b9fd9;
  --color-tg-glow: rgba(59, 159, 217, 0.12);
  --color-danger: #ef4444;
  --color-danger-hover: #dc2626;
  --color-brand-gold-bright: #f0d978;
  --color-brand-gold: #d4af37;
  --color-brand-gold-deep: #9a7b28;
  --sidebar-collapsed-width: 3.75rem;
  --sidebar-expanded-width: 16rem;
  --header-height: 4rem;
  --subheader-height: 3rem;
  --layout-gap: 1.25rem;
  --font-sans: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font-sans);
  background: var(--color-bg-base);
  color: var(--color-text-primary);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select { font: inherit; }
button { cursor: pointer; border: none; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
table { border-collapse: collapse; width: 100%; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 999px; }

.demo-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: #7c2d12; color: #ffedd5; font-size: 11px; font-weight: 600;
  text-align: center; padding: 4px 8px; letter-spacing: 0.02em;
}
.app-root { height: 100%; padding-top: 22px; }

/* Login */
.login-page {
  min-height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 24px; background:
    radial-gradient(ellipse at 20% 0%, rgba(99,102,241,0.15), transparent 50%),
    radial-gradient(ellipse at 80% 100%, rgba(212,175,55,0.08), transparent 45%),
    var(--color-bg-base);
}
.login-card {
  width: 100%; max-width: 420px; background: var(--color-bg-card);
  border: 1px solid var(--color-border-subtle); border-radius: 16px; padding: 28px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}
.login-card-header { display: flex; align-items: center; gap: 14px; }
.login-card-title { margin: 0; font-size: 20px; font-weight: 700; }
.login-card-subtitle { margin: 2px 0 0; color: var(--color-text-secondary); font-size: 13px; }
.login-divider { height: 1px; background: var(--color-border-subtle); margin: 20px 0; }
.login-field { margin-bottom: 14px; }
.login-field-label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
.login-input-wrap { position: relative; }
.login-input-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-text-muted); }
.login-input {
  width: 100%; border-radius: 10px; border: 1px solid var(--color-border);
  background: var(--color-bg-input); color: #111; padding: 10px 40px 10px 38px;
}
.login-input:focus { outline: 2px solid var(--color-accent); outline-offset: 1px; }
.login-toggle-pass { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #555; }
.login-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.4); color: #fecaca; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
.login-submit {
  width: 100%; margin-top: 8px; border-radius: 10px; padding: 11px;
  background: var(--color-accent); color: white; font-weight: 600;
}
.login-submit:hover { background: var(--color-accent-hover); }
.login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.login-hint { margin-top: 14px; font-size: 11px; color: var(--color-text-muted); line-height: 1.45; }

.brand-mark {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 2px var(--color-brand-gold-deep), 0 0 0 4px var(--color-brand-gold);
}
.brand-mark--sm { width: 32px; height: 32px; }

/* Shell */
.shell { display: flex; height: 100%; overflow: hidden; background: var(--color-bg-base); }
.sidebar {
  width: var(--sidebar-expanded-width); flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--color-bg-shell); border-right: 1px solid var(--color-border-subtle);
  transition: width 280ms cubic-bezier(0.4,0,0.2,1);
}
.sidebar.is-collapsed { width: var(--sidebar-collapsed-width); }
.sidebar-logo {
  height: var(--header-height); display: flex; align-items: center; gap: 10px;
  padding: 0 12px; border-bottom: 1px solid var(--color-border-subtle); overflow: hidden;
}
.sidebar-logo-text { white-space: nowrap; font-size: 13px; font-weight: 700; }
.sidebar-logo-sub { font-size: 10px; color: var(--color-text-muted); font-weight: 500; }
.sidebar.is-collapsed .sidebar-logo-text,
.sidebar.is-collapsed .nav-label { display: none; }
.nav { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px;
  border-radius: 12px; color: var(--color-text-muted); transition: 0.2s;
}
.nav-item:hover { background: rgba(255,255,255,0.04); color: var(--color-text-secondary); }
.nav-item.is-active { background: rgba(99,102,241,0.18); color: #fff; box-shadow: inset 0 0 0 1px rgba(99,102,241,0.35); }
.nav-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.nav-footer { border-top: 1px solid var(--color-border-subtle); padding: 8px; }
.nav-item.danger:hover { color: var(--color-danger); background: rgba(239,68,68,0.08); }

.main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.header {
  height: var(--header-height); display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--color-border-subtle); background: var(--color-bg-shell);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center;
  color: var(--color-text-secondary); background: transparent;
}
.icon-btn:hover { background: var(--color-bg-hover); }
.header-title { font-size: 16px; font-weight: 650; margin: 0; }
.header-right { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--color-text-secondary); }
.role-switch {
  display: flex; align-items: center; gap: 6px; background: var(--color-bg-card);
  border: 1px solid var(--color-border-subtle); border-radius: 999px; padding: 4px 10px;
}
.role-switch select {
  background: transparent; border: none; color: var(--color-text-primary); outline: none;
}
.flag { width: 22px; height: 14px; object-fit: cover; border-radius: 2px; }

.subheader {
  height: var(--subheader-height); display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; border-bottom: 1px solid var(--color-border-subtle); background: rgba(12,11,22,0.85);
}
.tabs { display: flex; gap: 4px; }
.tab-btn {
  height: 32px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--color-text-muted);
}
.tab-btn:hover { color: var(--color-text-secondary); background: rgba(255,255,255,0.04); }
.tab-btn.is-active { color: #fff; background: rgba(99,102,241,0.2); }
.refresh-btn {
  height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--color-border-subtle); color: var(--color-text-secondary);
  display: inline-flex; align-items: center; gap: 6px;
}
.refresh-btn:hover { background: var(--color-bg-hover); }
.refresh-btn.is-spinning svg { animation: spin 0.8s linear infinite; }

.main-shell { flex: 1; min-height: 0; overflow: hidden; padding: var(--layout-gap); }
.page-stack { height: 100%; display: flex; flex-direction: column; gap: var(--layout-gap); min-height: 0; }

/* KPI */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; flex-shrink: 0; }
.kpi-card {
  background: var(--color-bg-card); border: 1px solid var(--color-border-subtle);
  border-radius: 14px; padding: 14px 16px;
}
.kpi-label { font-size: 12px; color: var(--color-text-muted); margin-bottom: 6px; }
.kpi-value { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }

.content-shell {
  flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--color-border-subtle); border-radius: 14px;
  background: var(--color-bg-content-shell);
}
.content-header {
  flex-shrink: 0; padding: 12px 14px; background: var(--color-bg-content-header);
  border-bottom: 1px solid var(--color-border-subtle); display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
}
.content-body { flex: 1; min-height: 0; overflow: auto; padding: 14px; background: var(--color-bg-content-body); }

.slicer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; }
.field {
  height: 34px; border-radius: 8px; border: 1px solid var(--color-border);
  background: var(--color-bg-nested-panel); color: var(--color-text-primary); padding: 0 10px; font-size: 12px;
}
.field:focus { outline: 1px solid var(--color-accent); }
.btn {
  height: 34px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--color-border-subtle); background: var(--color-bg-active); color: var(--color-text-primary);
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--color-border); }
.btn-primary { background: var(--color-accent); border-color: transparent; }
.btn-primary:hover { background: var(--color-accent-hover); }
.btn-wa { background: rgba(37,211,102,0.12); color: var(--color-wa); border-color: rgba(37,211,102,0.3); }
.btn-danger { background: rgba(239,68,68,0.12); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.seg { display: inline-flex; border: 1px solid var(--color-border-subtle); border-radius: 8px; overflow: hidden; }
.seg button { height: 34px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--color-text-muted); }
.seg button.is-active { background: var(--color-bg-active); color: #fff; }

/* Brand cards */
.brand-list { display: flex; flex-direction: column; gap: 14px; }
.brand-card {
  border: 1px solid var(--color-border-subtle); border-radius: 14px; overflow: hidden;
  background: var(--color-bg-card);
}
.brand-card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 14px; border-bottom: 1px solid var(--color-border-subtle); background: rgba(255,255,255,0.02);
}
.brand-card-title { font-weight: 700; font-size: 14px; }
.brand-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid var(--color-border-subtle);
  color: var(--color-text-secondary); background: rgba(255,255,255,0.03);
}
.badge-wa { color: var(--color-wa); border-color: rgba(37,211,102,0.35); background: var(--color-wa-glow); }
.badge-tg { color: var(--color-tg); border-color: rgba(59,159,217,0.35); background: var(--color-tg-glow); }

.acct-table { font-size: 12px; }
.acct-table th {
  text-align: left; padding: 10px 8px; color: var(--color-text-muted); font-weight: 600;
  border-bottom: 1px solid var(--color-border-subtle); background: rgba(0,0,0,0.15); position: sticky; top: 0;
}
.acct-table td { padding: 10px 8px; border-bottom: 1px solid rgba(42,39,68,0.55); vertical-align: middle; }
.acct-table tr:hover td { background: rgba(255,255,255,0.02); }
.plat-icon { width: 16px; height: 16px; vertical-align: middle; margin-right: 6px; }
.status-pill {
  display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700;
}
.status-active { background: rgba(37,211,102,0.15); color: var(--color-wa); }
.status-logout { background: rgba(239,68,68,0.15); color: #fca5a5; }
.session-valid { color: var(--color-wa); font-weight: 650; }
.session-invalid { color: #fca5a5; font-weight: 650; }
.yx { font-variant-numeric: tabular-nums; font-weight: 650; }
.yx.ok { color: var(--color-wa); }
.yx.bad { color: #fca5a5; }
.yx .den { color: var(--color-text-muted); font-weight: 500; }
.muted { color: var(--color-text-muted); }
.row-actions { display: flex; gap: 6px; align-items: center; }
.tiny-btn {
  width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
  border: 1px solid var(--color-border-subtle); color: var(--color-text-secondary);
}
.tiny-btn:hover { background: var(--color-bg-hover); }
.tiny-btn:disabled { opacity: 0.4; }
.progress-cell { min-width: 140px; }
.progress-bar {
  height: 6px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 4px;
}
.progress-bar > i { display: block; height: 100%; background: var(--color-accent); width: 0%; transition: width 0.3s; }
.marquee {
  font-size: 11px; color: var(--color-accent); white-space: nowrap; overflow: hidden;
  animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: 0.45; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* Ops stock */
.ops-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 14px; }
.stock-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 12px 14px; }
.stock-chip {
  border: 1px solid var(--color-border-subtle); border-radius: 10px; padding: 10px 8px; text-align: center;
  background: rgba(255,255,255,0.02); cursor: pointer;
}
.stock-chip:hover { border-color: var(--color-accent); background: rgba(99,102,241,0.08); }
.stock-chip-label { font-size: 11px; color: var(--color-text-muted); margin-bottom: 4px; }
.stock-chip-value { font-size: 18px; font-weight: 700; }
.ops-meta { display: flex; gap: 16px; font-size: 12px; color: var(--color-text-secondary); padding: 0 14px 12px; }
.ops-meta strong { color: var(--color-text-primary); }
.ops-meta .warn { color: #fbbf24; }

/* Job queue */
.jq-add {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px;
  padding: 12px; border: 1px solid var(--color-border-subtle); border-radius: 12px; background: var(--color-bg-card);
}
.jq-table th, .jq-table td { padding: 10px 8px; font-size: 12px; border-bottom: 1px solid rgba(42,39,68,0.55); text-align: left; }
.jq-table th { color: var(--color-text-muted); background: rgba(0,0,0,0.2); }
.job-status {
  display: inline-flex; height: 22px; align-items: center; padding: 0 8px; border-radius: 999px;
  font-size: 11px; font-weight: 700; text-transform: capitalize;
}
.job-queued { background: rgba(168,164,192,0.15); color: var(--color-text-secondary); }
.job-running { background: rgba(99,102,241,0.2); color: #c7d2fe; }
.job-completed { background: rgba(37,211,102,0.15); color: var(--color-wa); }
.job-failed { background: rgba(239,68,68,0.18); color: #fca5a5; }
.job-cancelled, .job-paused { background: rgba(251,191,36,0.15); color: #fbbf24; }

/* Reporting */
.report-table th, .report-table td { padding: 8px; font-size: 12px; border-bottom: 1px solid rgba(42,39,68,0.55); text-align: left; }
.report-table th { color: var(--color-text-muted); background: rgba(0,0,0,0.2); position: sticky; top: 0; }
.yes { color: var(--color-wa); font-weight: 700; }
.no { color: #fca5a5; font-weight: 700; }
.footer-bar {
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 10px 14px; border-top: 1px solid var(--color-border-subtle); background: var(--color-bg-content-header);
  font-size: 12px; color: var(--color-text-secondary);
}
.empty-state {
  padding: 40px 20px; text-align: center; color: var(--color-text-muted); font-size: 13px;
}

/* Settings */
.settings-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.settings-list { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
.settings-card {
  border: 1px solid var(--color-border-subtle); border-radius: 12px; background: var(--color-bg-card); overflow: hidden;
}
.settings-card-head {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 14px 16px; text-align: left; font-weight: 650;
}
.settings-card-head:hover { background: rgba(255,255,255,0.03); }
.settings-card-body { padding: 0 16px 16px; border-top: 1px solid var(--color-border-subtle); display: none; }
.settings-card.is-open .settings-card-body { display: block; padding-top: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row label { display: block; font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.switch {
  width: 40px; height: 22px; border-radius: 999px; background: var(--color-border); position: relative;
}
.switch.on { background: var(--color-accent); }
.switch::after {
  content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; transition: 0.2s;
}
.switch.on::after { left: 21px; }

/* Modal */
.modal-root {
  position: fixed; inset: 0; z-index: 1000; display: none; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.65); padding: 24px;
}
.modal-root.is-open { display: flex; }
.modal {
  width: min(720px, 100%); max-height: min(85vh, 800px); overflow: auto;
  background: var(--color-bg-card); border: 1px solid var(--color-border);
  border-radius: 16px; box-shadow: 0 24px 80px rgba(0,0,0,0.55);
}
.modal--lg { width: min(960px, 100%); }
.modal-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle); position: sticky; top: 0;
  background: var(--color-bg-card); z-index: 1;
}
.modal-title { margin: 0; font-size: 15px; font-weight: 700; }
.modal-body { padding: 16px; }
.modal-foot {
  display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px;
  border-top: 1px solid var(--color-border-subtle); position: sticky; bottom: 0; background: var(--color-bg-card);
}
.qr-box {
  width: 200px; height: 200px; margin: 12px auto; border-radius: 12px;
  background: repeating-linear-gradient(45deg, #111 0 8px, #222 8px 16px);
  border: 1px solid var(--color-border); position: relative; overflow: hidden;
}
.qr-box::after {
  content: 'QR'; position: absolute; inset: 0; display: grid; place-items: center;
  font-weight: 800; color: rgba(255,255,255,0.35); letter-spacing: 0.2em;
}
.qr-box.loading::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent, rgba(99,102,241,0.25), transparent);
  animation: shimmer 1.2s infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.picker-list { display: flex; flex-direction: column; gap: 8px; }
.picker-item {
  text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--color-border-subtle);
  background: rgba(255,255,255,0.02);
}
.picker-item:hover { border-color: var(--color-accent); background: rgba(99,102,241,0.08); }
.picker-item strong { display: block; margin-bottom: 2px; }
.picker-item span { font-size: 12px; color: var(--color-text-muted); }
.check-list { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow: auto; }
.check-item {
  display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px;
  background: rgba(255,255,255,0.02); font-size: 12px;
}
.toast {
  position: fixed; right: 20px; bottom: 20px; z-index: 1100; display: none;
  background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: 10px;
  padding: 12px 14px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); max-width: 320px;
}
.toast.is-open { display: block; }

@media (max-width: 1100px) {
  .kpi-grid, .settings-kpis { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 960px) {
  .stock-strip { grid-template-columns: repeat(3, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
}

/* Desktop review target (≥1280px) — keep dense app layout */
@media (min-width: 1280px) {
  .main-shell { padding: 16px; }
  .acct-table { font-size: 12.5px; }
}

.group-links-admin-badge{display:inline-block;padding:.125rem .5rem;border-radius:.25rem;font-size:.625rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.group-links-admin-badge--yes{background:rgba(34,197,94,.18);color:#86efac}.group-links-admin-badge--no{background:rgba(255,255,255,.06);color:var(--color-text-muted)}
.group-links-pagination{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .75rem;width:100%;padding-top:.375rem;font-size:.6875rem;color:var(--color-text-muted)}
.group-links-pagination-label{font-weight:600;color:var(--color-text-secondary)}.group-links-pagination-actions{display:flex;gap:.375rem;margin-left:auto}
.group-links-modal-footer{display:flex;flex-shrink:0;align-items:center;justify-content:flex-end;padding:.375rem .625rem .5rem;border-top:1px solid rgba(255,255,255,.06)}
.group-links-empty{display:flex;height:calc(1.75rem + 1.625rem * 15);flex-direction:column;align-items:center;justify-content:center;gap:.75rem;border:1px solid rgba(255,255,255,.08);border-radius:.375rem;padding:1rem}
.group-links-empty-text{margin:0;font-size:.8125rem;color:var(--color-text-muted)}
.modal--stock{display:flex!important;width:min(92vw,72rem)!important;max-height:88vh;overflow:hidden!important;flex-direction:column}
.modal--matrix>.modal-body,.modal--details>.modal-body,.modal--stock>.modal-body{display:flex;min-height:0;flex:1;flex-direction:column;padding:10px 12px}
.modal--matrix .modal-tabs,.modal--details .modal-tabs{align-self:flex-start;margin-bottom:8px}
.modal-table-body{display:flex;min-height:0;flex:1;flex-direction:column;overflow:hidden;padding:10px 12px}
.modal-table-scroll{flex:1;min-height:0;overflow:auto;border:1px solid var(--color-border-subtle);border-radius:6px}
.modal-table-scroll table thead th{position:sticky;top:0;z-index:2;background:#12101f}
.modal-tabs{display:inline-flex;gap:2px;border-radius:7px;background:#090812;padding:2px}
.modal-tab{border-radius:5px;padding:5px 12px;font-size:10px;color:var(--color-text-muted)}
.modal-tab.is-active{background:#282344;color:#fff}
.matrix-filter{display:inline-flex;align-items:center;gap:3px}
.matrix-filter select{width:auto;min-width:54px;border:0;background:transparent;color:inherit;font-size:10px}
.matrix-filtered{background:rgba(99,102,241,.06)}
.empty-modal-state{display:flex;min-height:360px;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--color-text-muted);font-size:12px}
.details-fixed-body{height:calc(28px + 26px * 15)}
.modal-one-line-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 12px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:var(--color-text-muted)}
.modal-one-line-actions{display:flex;align-items:center;gap:5px}
.stock-status-pill{display:inline-flex;border-radius:5px;padding:3px 7px;font-size:9px;font-weight:600;text-transform:capitalize}
.stock-status-pill.active{color:#37dc80;background:rgba(37,211,102,.12);border:1px solid rgba(37,211,102,.25)}
.stock-status-pill.ready{color:#6aa7ff;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.25)}
.stock-status-pill.recycle{color:#fbbf24;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25)}
.stock-status-pill.review{color:#fb923c;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25)}
.qr-demo{display:grid;grid-template-columns:1fr 264px;gap:20px;align-items:center}
.qr-box{height:260px;border:1px solid var(--color-border);border-radius:12px;background:#1a1825;display:grid;place-items:center}
.qr-code{width:180px;height:180px;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/18px 18px;border:12px solid #fff}
.qr-steps{display:flex;flex-direction:column;gap:10px;color:var(--color-text-secondary);font-size:12px}
.qr-step{display:flex;gap:8px;align-items:center}.qr-step i{display:grid;width:18px;height:18px;place-items:center;border-radius:50%;background:#282536;font-style:normal;font-size:10px}
.flat-table-frame{height:100%;overflow:auto;border:1px solid var(--color-border-subtle);border-radius:10px;background:var(--color-bg-card)}
.brand-add-card{display:flex;min-height:5.5rem;flex-shrink:0;flex-direction:column;align-items:center;justify-content:center;gap:.5rem;border-radius:.75rem;border:1.5px dashed rgba(255,255,255,.18);background:rgba(255,255,255,.02);padding:1.25rem;color:var(--color-text-muted);cursor:pointer;transition:border-color 160ms ease,background-color 160ms ease,color 160ms ease}
.brand-add-card:hover{border-color:rgba(37,211,102,.45);background:rgba(37,211,102,.06);color:var(--color-wa)}
.brand-add-card-icon{display:inline-flex;height:2.25rem;width:2.25rem;align-items:center;justify-content:center;border-radius:999px;background:rgba(255,255,255,.06);font-size:1.25rem;line-height:1}
.brand-add-card-caption{font-size:.8125rem;font-weight:500}
.job-status{display:inline-flex;align-items:center;height:1.375rem;padding:0 .5rem;border-radius:999px;font-size:.6875rem;font-weight:700;text-transform:capitalize}
.job-status.job-completed,.job-completed{background:rgba(37,211,102,.15);color:#37dc80}
.job-status.job-queued,.job-queued{background:rgba(148,163,184,.15);color:#cbd5e1}
.job-status.job-running,.job-running{background:rgba(59,130,246,.15);color:#6aa7ff}
.job-status.job-failed,.job-failed{background:rgba(239,68,68,.15);color:#fca5a5}
.job-status.job-cancelled,.job-cancelled,.job-status.job-paused,.job-paused{background:rgba(245,158,11,.15);color:#fbbf24}
  </style>

  function enhanceDarkSelects(root = document) {
    $$('select:not([multiple]):not([data-wf-enhanced])', root).forEach((select) => {
      select.dataset.wfEnhanced = 'true';
      const wrap = document.createElement('div');
      wrap.className = 'dark-select-wrap';
      select.parentNode.insertBefore(wrap, select);
      wrap.appendChild(select);
      select.classList.add('wf-native-select');

      const trigger = document.createElement('button');
      trigger.type = 'button';
      trigger.className = `dark-select-trigger ${[...select.classList].filter((name) => !['dark-select','wf-native-select'].includes(name)).join(' ')}`;
      trigger.disabled = select.disabled;
      trigger.setAttribute('aria-haspopup', 'listbox');
      trigger.setAttribute('aria-expanded', 'false');
      if (select.getAttribute('aria-label')) trigger.setAttribute('aria-label', select.getAttribute('aria-label'));

      const label = document.createElement('span');
      label.className = 'dark-select-trigger-label';
      const current = select.options[select.selectedIndex];
      label.textContent = current?.textContent || select.getAttribute('placeholder') || '';
      if (!select.value) label.classList.add('dark-select-trigger-label--placeholder');
      trigger.append(label);
      trigger.insertAdjacentHTML('beforeend', selectChevron);

      const menu = document.createElement('ul');
      menu.className = 'dark-select-menu';
      menu.setAttribute('role', 'listbox');
      [...select.options].filter((option) => option.value !== '').forEach((option) => {
        const li = document.createElement('li');
        const item = document.createElement('button');
        item.type = 'button';
        item.className = `dark-select-menu-item${option.value === select.value ? ' dark-select-menu-item--active' : ''}${option.disabled ? ' dark-select-menu-item--disabled' : ''}`;
        item.textContent = option.textContent;
        item.disabled = option.disabled;
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', String(option.value === select.value));
        item.addEventListener('mousedown', (event) => {
          event.preventDefault();
          if (option.disabled) return;
          select.value = option.value;
          label.textContent = option.textContent;
          label.classList.toggle('dark-select-trigger-label--placeholder', !option.value);
          select.dispatchEvent(new Event('change', { bubbles: true }));
          closeDarkSelects();
        });
        li.append(item);
        menu.append(li);
      });

      trigger.addEventListener('click', () => {
        if (trigger.disabled) return;
        const opening = !wrap.classList.contains('is-open');
        closeDarkSelects(wrap);
        wrap.classList.toggle('is-open', opening);
        menu.classList.toggle('dark-select-menu--open', opening);
        trigger.querySelector('.dark-select-trigger-icon')?.classList.toggle('dark-select-trigger-icon--open', opening);
        trigger.setAttribute('aria-expanded', String(opening));
        if (opening) {
          const rect = trigger.getBoundingClientRect();
          const needed = Math.min(280, menu.children.length * 32 + 8);
          menu.classList.toggle('dark-select-menu--drop-up', window.innerHeight - rect.bottom < needed && rect.top > window.innerHeight - rect.bottom);
        }
      });
      wrap.append(trigger, menu);
    });

    if (!window.__wfDarkSelectBound) {
      window.__wfDarkSelectBound = true;
      document.addEventListener('mousedown', (event) => {
        if (!event.target.closest('.dark-select-wrap')) closeDarkSelects();
      });
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeDarkSelects();
      });
    }
  }

  function yx(cur, tot, aligned) {
    const cls = aligned || cur >= tot ? 'ok' : 'bad';
    return `<span class="yx ${cls}">${cur}<span class="den">/${tot}</span></span>`;
  }

  function clockTick() {
    const el = $('#live-clock');
    if (!el) return;
    el.textContent = new Date().toLocaleString();
  }

  function kpiAccount() {
    const accounts = WF.allAccounts();
    return [
      { label: 'Brands', value: WF_STATE.brands.length },
      { label: 'Accounts', value: accounts.length },
      { label: 'Online', value: accounts.filter((a) => a.sessionStatus === 'valid').length },
      { label: 'Aligned', value: accounts.filter((a) => a.sessionStatus === 'valid' && !a.isMisaligned && a.syncState === 'synced').length },
    ];
  }

  function filteredBrands() {
    const f = WF_STATE.filters.account;
    return WF_STATE.brands.map((b) => {
      let accounts = [...b.accounts];
      if (f.brand !== 'all' && b.brandName !== f.brand) accounts = [];
      if (f.platform !== 'all') accounts = accounts.filter((a) => a.platform === f.platform);
      if (f.status === 'valid') accounts = accounts.filter((a) => a.sessionStatus === 'valid');
      if (f.status === 'invalid') accounts = accounts.filter((a) => a.sessionStatus !== 'valid');
      if (f.search) {
        const q = f.search.toLowerCase();
        accounts = accounts.filter((a) => a.accountName.toLowerCase().includes(q) || a.phoneNumber.includes(q));
      }
      return { ...b, accounts };
    }).filter((b) => b.accounts.length || f.brand === 'all' || b.brandName === f.brand);
  }

  function accountRowCells(a, showBrand) {

          ? `<button class="brand-card-action-btn details-group-btn" data-group-link="${a.id}">Details Group</button>`
          : `<span class="muted">—</span>`);
    const adminPct = a.adminTotal ? Math.round(a.adminCurrent / a.adminTotal * 100) : 0;
    return `
      <td class="brand-col-cell brand-col-cell--account">
        <div class="account-cell">
          <span class="platform-badge ${a.platform==='whatsapp'?'wa':'tg'}"><img src="${platIcon(a.platform)}" alt="${a.platform}" /></span>
          <div style="min-width:0;flex:1"><div class="account-name">${esc(a.accountName)}</div><div class="account-phone">${a.phoneNumber ? esc(a.phoneNumber) : '<span style="color:var(--color-danger)">Phone number missing</span>'}</div></div>

      <td>${a.groupsCurrent}</td>

      <td><div class="admin-progress"><span class="metric-ratio ${alignedA?'aligned':'short'}"><span class="current">${a.adminCurrent}</span>/${a.adminTotal}</span><div class="admin-progress-track"><i class="${alignedA?'good':''}" style="width:${adminPct}%"></i></div></div></td>

        </tr></thead>
        <tbody>
          ${jobs.length ? jobs.map((j) => {
            const batchCell = jq.taskType === 'create_group'
              ? (j.batchLabel || `${j.progress.total}`)
              : String(j.progress.total);
            const progressCell = j.action === 'set_group_photo'
              ? `Set photo ${j.progress.current}/${j.progress.total} group(s)`
              : jq.taskType === 'create_group' && j.status === 'completed'
                ? `${j.progress.current}/${j.progress.total} created`
                : `${j.progress.current}/${j.progress.total}`;
            return `
            <tr>
              <td class="operations-job-queue-select-col"><input class="operations-job-queue-row-checkbox" type="checkbox" data-job-sel="${j.id}" /></td>
              <td><span class="job-status job-${j.status}">${({ queued:'Queued', paused:'Paused', running:'Process '+j.progress.current+'/'+j.progress.total, completed:'Completed', failed:'Failed', cancelled:'Cancelled' })[j.status] || j.status}</span></td>
              <td>${esc(j.brandName)}</td>
              <td><img class="plat-icon" src="${platIcon(j.platform)}" alt="" />${esc(j.accountName)}</td>
              <td>${esc(batchCell)}</td>
              <td>${esc(progressCell)}</td>
              <td class="muted">${esc(fmtTime(j.createdAt))}</td>
              <td><div class="operations-job-queue-row-actions">
                ${j.status==='queued' || j.status==='paused' || j.status==='cancelled' ? `<button class="operations-job-queue-btn operations-job-queue-btn--row" data-job-run="${j.id}">RUN</button>` : ''}
                ${j.status==='running' ? `<button class="operations-job-queue-btn operations-job-queue-btn--row" data-job-pause="${j.id}">PAUSE</button><button class="operations-job-queue-btn operations-job-queue-btn--row operations-job-queue-btn--danger" data-job-cancel="${j.id}">CANCEL</button>` : ''}
                ${j.status==='completed' || j.status==='failed' ? `<button class="operations-job-queue-btn operations-job-queue-btn--row" data-job-view="${j.id}">VIEW</button>` : ''}
                ${j.status==='failed' ? `<button class="operations-job-queue-btn operations-job-queue-btn--row" data-job-run="${j.id}">RUN</button>` : ''}
              </div>
              </td>
              ${jq.taskType==='create_group'?`<td class="operations-job-queue-remark-cell">${esc(j.remark || '—')}</td>`:''}
            </tr>`;
          }).join('') : `<tr><td colspan="${jq.taskType==='create_group'?9:8}" class="muted">No ${esc(({join:'join',create_group:'create',set_admin:'set admin',exit_delete_group:'exit & delete'})[jq.taskType]||jq.taskType)} tasks in queue.</td></tr>`}
        </tbody>
      </table></div>
      <div style="margin-top:8px"><button class="operations-job-queue-btn operations-job-queue-btn--danger" id="jq-delete-sel">Delete selected</button></div>`}
      </section>
    </div>`;
  }

  function renderReporting() {
    const f = WF_STATE.filters.reporting;
    const groups = (WF_DATA.masterGroups[f.brand] || []).filter((g) => {
      if (f.status !== 'all' && g.status !== f.status) return false;
      if (f.search && !g.groupName.toLowerCase().includes(f.search.toLowerCase())) return false;
      return true;
    });
    const accs = WF_DATA.reportingAccounts.filter((n) => {
      const a = WF.allAccounts().find((x) => x.accountName === n);
      return a && a.brandName === f.brand && a.platform === f.platform;
    });

    let body;
    if (f.search.trim().toLowerCase() === 'error') {
      body = `<p class="reporting-empty" style="padding:16px 20px;color:var(--color-danger)">Failed to load report. (demo state)</p>`;
    } else if (!groups.length) {
      body = `<div class="empty-state">No rows for current filters. <button class="btn" id="report-clear">Clear status filter</button></div>`;
    } else if (f.accName === 'all') {
      body = `<div class="reporting-table-shell"><div class="reporting-table-scroll"><table class="join-report-table"><thead class="reporting-table-head"><tr>
        <th class="join-report-table__col-no">No</th><th>Group Name</th><th>Group ID</th><th>Group Link</th><th>Status</th>
        ${accs.map((n) => `<th class="join-report-table__account-col">${esc(n)}</th>`).join('')}
      </tr></thead><tbody>
        ${groups.map((g, i) => `<tr>
          <td class="join-report-table__col-no">${i+1}</td><td>${esc(g.groupName)}</td><td class="join-report-table__mono">${esc(g.groupId)}</td>
          <td>${g.inviteLink ? `<a class="join-report-table__link" href="${esc(g.inviteLink)}">link</a>` : '—'}</td>
          <td><span class="operations-stock-chip operations-stock-chip--${esc(g.status)}"><span class="operations-stock-chip-label">${esc(g.status[0].toUpperCase()+g.status.slice(1))}</span></span></td>
          ${accs.map((_, idx) => `<td class="${(i+idx)%3===0?'join-report-table__no':'join-report-table__yes'}">${(i+idx)%3===0?'No':'Yes'}</td>`).join('')}
        </tr>`).join('')}
      </tbody></table></div></div>`;
    } else {
      const isAdminView = f.bookmark === 'full_admin';
      body = `<div class="reporting-table-shell"><div class="reporting-table-scroll"><table class="join-report-table ${isAdminView?'join-report-table--daily-admin':'join-report-table--daily-group'}"><thead class="reporting-table-head"><tr>
        <th class="join-report-table__col-no">No</th><th>Group Name</th><th>Group ID</th>${isAdminView?'':'<th class="join-report-table__col-center">Member Count</th><th class="join-report-table__col-center">Admin Count</th>'}<th>Group Link</th><th>Status</th><th class="join-report-table__col-center">Is Admin</th>
      </tr></thead><tbody>
        ${groups.map((g, i) => `<tr>
          <td class="join-report-table__col-no">${i+1}</td><td>${esc(g.groupName)}</td><td class="join-report-table__mono">${esc(g.groupId)}</td>
          ${isAdminView?'':`<td class="join-report-table__col-center">${g.members}</td><td class="join-report-table__col-center">${g.admins}</td>`}
          <td class="join-report-table__col-link">${g.inviteLink ? `<a class="join-report-table__link" href="${esc(g.inviteLink)}">link</a>` : '—'}</td>
          <td><span class="operations-stock-chip operations-stock-chip--${esc(g.status)}"><span class="operations-stock-chip-label">${esc(g.status[0].toUpperCase()+g.status.slice(1))}</span></span></td>
          <td class="${g.isAdmin?'join-report-table__yes':'join-report-table__no'}">${g.isAdmin?'Yes':'No'}</td>
        </tr>`).join('')}
      </tbody></table></div></div>`;
    }

    return `
      <div class="page-stack">
        <section class="content-area-shell">
          <header class="content-area-header content-area-header--reporting">
            <div class="content-slicer-bar reporting-slicer-bar">
              <div class="account-slicer-row reporting-slicer-row">
                <div class="account-slicer-left">
                  <form class="account-slicer-search-group"><input type="search" class="account-slicer-search" id="rep-search" placeholder="Search Group Name" value="${esc(f.search)}" /><button type="submit" class="account-slicer-search-btn">Enter</button></form>
                </div>
                <div class="account-slicer-right reporting-slicer-right">
                  <div class="reporting-slicer-filters">
              <label class="reporting-slicer-field"><span class="reporting-slicer-label">Platform</span><select class="account-slicer-select dark-select" id="rep-platform">
                <option value="whatsapp" ${f.platform==='whatsapp'?'selected':''}>WhatsApp</option>
                <option value="telegram" ${f.platform==='telegram'?'selected':''}>Telegram</option>
              </select></label>
              <label class="reporting-slicer-field"><span class="reporting-slicer-label">Brand</span><select class="account-slicer-select dark-select" id="rep-brand">
                ${WF_STATE.brands.map((b) => `<option value="${esc(b.brandName)}" ${f.brand===b.brandName?'selected':''}>${esc(b.brandName)}</option>`).join('')}
              </select></label>
              <label class="reporting-slicer-field"><span class="reporting-slicer-label">Acc Name</span><select class="account-slicer-select dark-select" id="rep-acc">
                <option value="all" ${f.accName==='all'?'selected':''}>All</option>
                ${accs.map((n) => `<option value="${esc(n)}" ${f.accName===n?'selected':''}>${esc(n)}</option>`).join('')}
              </select></label>
              <label class="reporting-slicer-field"><span class="reporting-slicer-label">Status</span><select class="account-slicer-select dark-select" id="rep-status">
                <option value="all">All</option>
                ${['active','ready','recycle','review','other'].map((s) => `<option value="${s}" ${f.status===s?'selected':''}>${s[0].toUpperCase()+s.slice(1)}</option>`).join('')}
              </select></label>
                  </div>
                  <div class="account-slicer-view-toggle">
                    <button type="button" data-rep-bm="full_group" class="account-slicer-view-btn ${f.bookmark==='full_group'?'account-slicer-view-btn--active':''}">Full Group</button>
                    <button type="button" data-rep-bm="full_admin" class="account-slicer-view-btn ${f.bookmark==='full_admin'?'account-slicer-view-btn--active':''}">Full Admin</button>
                  </div>
                </div>
              </div>
            </div>
          </header>
          <div class="content-area-body">
            <div class="content-nested-panel reporting-nested-panel">
              <div class="reporting-table-panel">${body}</div>
              <div class="reporting-card-footer">
                <div class="reporting-card-footer-meta"><span>${groups.length} row(s)</span><span>Page 1 of 1</span></div>
                <div class="reporting-card-footer-actions"><button class="group-links-page-btn" disabled>Previous</button><button class="group-links-page-btn" disabled>Next</button><button class="group-links-export-btn" id="rep-export">Export</button></div>
              </div>
            </div>
          </div>
        </section>
      </div>`;
  }

  /* ---------- Modals ---------- */
  function renderModal() {
    const root = $('#modal-root');
    const m = WF_STATE.modal;
    if (!m) { root.classList.remove('is-open'); root.innerHTML = ''; return; }
    root.classList.add('is-open');
    const map = {
      'scrape-prompt': modalScrapePrompt,
      'platform-login': modalPlatformLogin,
      'missing-phone': modalMissingPhone,
      'sync-error': modalAlert,
      'scrape-cancel': modalScrapeCancel,
      'group-link-picker': modalGroupLinkPicker,
      'group-links': modalGroupLinks,
      'master-groups': modalMasterGroups,
      'stock-detail': modalStockDetail,
      'jq-setup': modalJqSetup,
      'jq-view': modalJqView,
      'add-brand': modalAddBrand,
      'add-account': modalAddAccount,
    };
    const fn = map[m.type] || modalAlert;
    root.innerHTML = fn(m.payload || {});
    bindModalEvents();
    enhanceDarkSelects(root);
  }

  function modalShell(title, body, foot, lg, kind = '') {
    return `<div class="modal brand-modal-panel ${lg?'modal--lg brand-modal-panel--group-links':''} ${kind}" role="dialog">
      <div class="modal-head brand-modal-header"><h3 class="modal-title brand-modal-title">${title}</h3>
        <button type="button" class="icon-btn brand-modal-close" data-close-modal aria-label="Close">✕</button></div>
      <div class="modal-body">${body}</div>
      ${foot ? `<div class="modal-foot brand-modal-actions">${foot}</div>` : ''}
    </div>`;
  }

  function modalScrapePrompt(p) {
    const plat = p.platform === 'telegram' ? 'Telegram' : 'WhatsApp';
    return modalShell(`${esc(p.accountName)} · ${plat}`,
      `<p style="margin:0;font-size:13px;line-height:1.5;color:var(--color-text-secondary)">Session is Valid. Run <strong>Scrape now</strong> for a full group refresh, or choose Later.</p>`,
      `<button class="btn" data-close-modal>Later</button><button class="btn btn-primary" data-scrape-now="${p.accountId}">Scrape now</button>`);
  }

  function modalPlatformLogin(p) {
    const loading = p.phase === 'loading';
    return modalShell(`${p.platform === 'telegram' ? 'Telegram' : 'WhatsApp'} login`,
      `<div class="qr-demo">
         <div class="qr-box">${loading ? '<span class="marquee">Generating QR…</span>' : '<div class="qr-code" aria-label="Demo QR"></div>'}</div>
         <div class="qr-steps">
           <strong>${esc(p.accountName)}</strong>
           <span class="muted">Scan this QR from the messaging app on your marketing phone.</span>
           <div class="qr-step"><i>1</i><span>Open ${p.platform === 'telegram' ? 'Telegram' : 'WhatsApp'} on your phone</span></div>
           <div class="qr-step"><i>2</i><span>Open Linked Devices / Devices</span></div>
           <div class="qr-step"><i>3</i><span>Scan the code and wait until session is ready</span></div>
         </div>
       </div>`,
      `<button class="btn" data-close-modal>Cancel</button>
       ${loading ? '' : `<button class="btn btn-primary" data-simulate-scan="${p.accountId}">Simulate scan success</button>`}`);
  }

      `<button class="btn btn-primary" data-close-modal>OK</button>`);

  function modalGroupLinkPicker(p) {
    return modalShell('Which group list?',

      </div>`,
      `<button class="btn" data-close-modal>Close</button>`);

  function modalGroupLinks(p) {
    const found = WF.findAccount(p.accountId);
    const brand = found?.account.brandName || 'M24SG';
    const mode = WF_STATE.details.mode || 'account';
    const allRows = mode === 'junk' ? WF_DATA.junkGroups : (WF_DATA.masterGroups[brand] || []);
    const pageSize = 15;
    const pages = Math.max(1, Math.ceil(allRows.length / pageSize));
    WF_STATE.details.page = Math.min(WF_STATE.details.page || 1, pages);
    const start = (WF_STATE.details.page - 1) * pageSize;
    const rows = allRows.slice(start, start + pageSize);
    const content = rows.length ? `
      <div class="group-links-table-wrap ${mode==='account'?'group-links-table-wrap--account-daily':''} group-links-table-wrap--scroll details-fixed-body"><table class="group-links-table ${mode==='account'?'group-links-table--account-daily':''}">
        <thead><tr>${mode === 'account'
          ? '<th>No</th><th>Group name</th><th>Group ID</th><th>Member count</th><th>Admin count</th><th>Is admin</th><th>Invite link</th>'
          : '<th>Group name</th><th>Group ID</th><th>Invite link</th><th>Admin</th>'}</tr></thead>
        <tbody>${rows.map((g, i) => mode === 'account' ? `<tr>
          <td class="group-links-table__num">${start + i + 1}</td><td class="group-links-table__name">${esc(g.groupName)}</td><td class="group-links-table__id">${esc(g.groupId)}</td>
          <td class="group-links-table__count">${g.members ?? '—'}</td><td class="group-links-table__count">${g.admins ?? '—'}</td><td class="group-links-table__admin"><span class="group-links-admin-badge group-links-admin-badge--${g.isAdmin?'yes':'no'}">${g.isAdmin?'Yes':'No'}</span></td>
          <td class="group-links-table__link">${g.inviteLink ? `<a href="${esc(g.inviteLink)}" target="_blank">${esc(g.inviteLink)}</a>` : '—'}</td>
        </tr>` : `<tr><td class="group-links-table__name">${esc(g.groupName)}</td><td class="group-links-table__id">${esc(g.groupId)}</td><td class="group-links-table__link">${g.inviteLink?`<a href="${esc(g.inviteLink)}" target="_blank">${esc(g.inviteLink)}</a>`:'—'}</td><td class="group-links-table__admin"><span class="group-links-admin-badge group-links-admin-badge--${g.isAdmin?'yes':'no'}">${g.isAdmin?'Yes':'No'}</span></td></tr>`).join('')}</tbody>
      </table></div>` : `<div class="group-links-empty"><p class="group-links-empty-text">No data</p><button class="join-report-table__filter-empty-btn" data-details-back>‹ Back</button></div>`;
    return `<section class="modal brand-modal-panel brand-modal-panel--group-links brand-modal-panel--details-group modal--details" role="dialog">
      <header class="modal-head brand-modal-header group-links-modal-header">

  function renderToast() {
    const el = $('#toast');
    if (!el) return;
    if (!WF_STATE.toast) { el.classList.remove('is-open'); el.textContent = ''; return; }
    el.textContent = WF_STATE.toast;
    el.classList.add('is-open');
  }

  /* ---------- Actions ---------- */
  function startSync(accountId) {
    const found = WF.findAccount(accountId);
    if (!found) return;
    const { account } = found;
    if (!account.phoneNumber) {
      WF.openModal('missing-phone', { accountId, accountName: account.accountName });
      return;
    }
    account.actionProcess = 'session_check';
    renderPage();
    setTimeout(() => {
      if (account.sessionStatus === 'invalid') {
        account.actionProcess = null;
        WF.openModal('platform-login', { accountId, accountName: account.accountName, platform: account.platform, phase: 'loading' });
        renderPage();
        setTimeout(() => {
          if (WF_STATE.modal?.type === 'platform-login') {
            WF_STATE.modal.payload.phase = 'ready';
            renderModal();
          }
        }, 900);
        return;
      }
      account.actionProcess = null;
      WF.openModal('scrape-prompt', { accountId, accountName: account.accountName, platform: account.platform });
      renderPage();
    }, 700);
  }

  function startScrape(accountId) {
    const found = WF.findAccount(accountId);
    if (!found) return;
    const { account } = found;
    account.actionProcess = 'scraper';
    account.scrapeProgress = { current: 0, total: 8 };
    WF.closeModal();
    renderPage();
    const t = setInterval(() => {
      if (account.actionProcess !== 'scraper') { clearInterval(t); return; }
      account.scrapeProgress.current += 1;
      if (account.scrapeProgress.current >= account.scrapeProgress.total) {
        clearInterval(t);
        account.actionProcess = null;
        account.scrapeProgress = null;
        account.lastSyncAt = new Date().toISOString();
        account.sessionStatus = 'valid';
        account.status = 'active';
        account.syncState = 'synced';
        WF.toast('Scrape completed (demo)');
        renderPage();
        return;
      }
      renderPage();
    }, 450);
  }

    $('#rep-acc')?.addEventListener('change', (e) => { WF_STATE.filters.reporting.accName = e.target.value; renderPage(); });
    $('#rep-status')?.addEventListener('change', (e) => { WF_STATE.filters.reporting.status = e.target.value; renderPage(); });
    $$('[data-rep-bm]').forEach((b) => b.addEventListener('click', () => { WF_STATE.filters.reporting.bookmark = b.dataset.repBm; renderPage(); }));
    $('#report-clear')?.addEventListener('click', () => { WF_STATE.filters.reporting.status = 'all'; renderPage(); });
    $('#rep-export')?.addEventListener('click', () => WF.toast('Export Excel (demo)'));

    $$('[data-settings-toggle]').forEach((b) => b.addEventListener('click', () => {
      WF_STATE.settingsOpen = WF_STATE.settingsOpen === b.dataset.settingsToggle ? '' : b.dataset.settingsToggle;
      renderPage();
    }));
    $('#auto-scrape-switch')?.addEventListener('click', (e) => {
      WF_DATA.settings.autoScrapeEnabled = !WF_DATA.settings.autoScrapeEnabled;
      e.currentTarget.classList.toggle('on', WF_DATA.settings.autoScrapeEnabled);
      WF.toast('Auto-scrape ' + (WF_DATA.settings.autoScrapeEnabled ? 'On' : 'Off'));
    });
    $('#btn-check-update')?.addEventListener('click', () => {
      const msg = $('#update-msg');
      if (msg) msg.textContent = 'Checking…';
      setTimeout(() => { if (msg) msg.textContent = `Current v${WF_DATA.version}. You are on the latest release (demo).`; }, 800);
    });
  }

  function bindModalEvents() {
    $$('[data-close-modal]').forEach((b) => b.addEventListener('click', () => WF.closeModal()));
    $('#modal-root')?.addEventListener('click', (e) => { if (e.target.id === 'modal-root') WF.closeModal(); });
    $$('[data-scrape-now]').forEach((b) => b.addEventListener('click', () => startScrape(b.dataset.scrapeNow)));
    $$('[data-simulate-scan]').forEach((b) => b.addEventListener('click', () => {
      const f = WF.findAccount(b.dataset.simulateScan);
      if (f) { f.account.sessionStatus = 'valid'; f.account.status = 'active'; }
      WF.openModal('scrape-prompt', { accountId: b.dataset.simulateScan, accountName: f?.account.accountName, platform: f?.account.platform });
    }));
    $$('[data-save-phone]').forEach((b) => b.addEventListener('click', () => {
      const phone = $('#missing-phone-input')?.value?.trim();
      const f = WF.findAccount(b.dataset.savePhone);
      if (!phone) { WF.toast('Enter phone'); return; }
      if (f) f.account.phoneNumber = phone;
      WF.closeModal();
      startSync(b.dataset.savePhone);
    }));
    $$('[data-confirm-cancel-scrape]').forEach((b) => b.addEventListener('click', () => {
      const f = WF.findAccount(b.dataset.confirmCancelScrape);
      if (f) { f.account.actionProcess = null; f.account.scrapeProgress = null; }
      WF.openModal('sync-error', { title: 'Scrape cancelled', message: 'Scrape was cancelled.' });
      renderPage();
    }));
    $$('[data-details-mode]').forEach((b) => b.addEventListener('click', () => {
      WF_STATE.details.mode = b.dataset.detailsMode;
      WF_STATE.details.page = 1;
      renderModal();
    }));
    $$('[data-details-page]').forEach((b) => b.addEventListener('click', () => {
      WF_STATE.details.page = Number(b.dataset.detailsPage);
      renderModal();
    }));
    $$('[data-details-back]').forEach((b) => b.addEventListener('click', () => {
      if (WF_STATE.details.mode === 'junk') {
        WF_STATE.details.mode = 'account';
        WF_STATE.details.page = 1;
        renderModal();
      } else {
        WF.closeModal();
      }
    }));
    $$('[data-matrix-bookmark]').forEach((b) => b.addEventListener('click', () => {
      WF_STATE.matrix.bookmark = b.dataset.matrixBookmark;
      WF_STATE.matrix.page = 1;
      renderModal();
    }));
    $$('[data-matrix-filter]').forEach((s) => s.addEventListener('change', () => {
      WF_STATE.matrix.filters[Number(s.dataset.matrixFilter)] = s.value;
      WF_STATE.matrix.page = 1;
      renderModal();
    }));
    $$('[data-matrix-page]').forEach((b) => b.addEventListener('click', () => {
      WF_STATE.matrix.page = Number(b.dataset.matrixPage);
      renderModal();
    }));
    $('#gl-export')?.addEventListener('click', () => WF.toast('Export Excel (demo)'));
    $$('[data-toast]').forEach((b) => b.addEventListener('click', () => WF.toast(b.dataset.toast)));
    $$('[data-setup-save]').forEach((b) => b.addEventListener('click', () => {
      const acc = WF.findAccount(WF_STATE.jq.accountId)?.account;
      if (!acc) { WF.toast('Select account first'); return; }
      if (acc.sessionStatus !== 'valid') { WF.toast('Session must be Valid'); return; }
      WF_STATE.jobs.unshift({
        id: 'job-' + Date.now(),
        action: WF_STATE.jq.taskType,
        taskType: WF_STATE.jq.taskType,
        brandName: acc.brandName,
        accountId: acc.id,
        accountName: acc.accountName,
        platform: acc.platform,
        status: 'queued',
        progress: { current: 0, total: 3 },
        createdAt: new Date().toISOString(),
        remark: 'Queued from SETUP (demo)',
        outcomes: [],
      });
      WF.toast('Job queued (demo)');
      WF.closeModal();
      renderPage();
    }));
    $$('[data-lang]').forEach((b) => b.addEventListener('click', () => {
      $$('[data-lang]').forEach((x) => x.classList.toggle('is-active', x === b));
      WF.toast('Language: ' + (b.dataset.lang === 'zh' ? '中文' : 'English') + ' (demo)');
    }));
    $$('[data-queue-set-photo]').forEach((b) => b.addEventListener('click', () => { WF.toast('Set Photo job queued (demo)'); WF.closeModal(); }));
    $$('.operations-job-queue-exit-group-tab').forEach((b) => b.addEventListener('click', () => {
      $$('.operations-job-queue-exit-group-tab').forEach((x) => x.classList.remove('operations-job-queue-exit-group-tab--active'));
      b.classList.add('operations-job-queue-exit-group-tab--active');
      const hint = b.closest('.modal')?.querySelector('.job-setup-hint');
      if (hint) {
        hint.textContent = b.textContent.trim() === 'Not in master'
          ? 'Daily groups not in brand master — difference daily minus master.'
          : 'All groups on this account from latest daily scrape (real device data).';
      }
    }));
    $$('[data-create-tab]').forEach((b) => b.addEventListener('click', () => {
      $$('[data-create-tab]').forEach((x) => x.classList.remove('is-active'));
      b.classList.add('is-active');
      const body = $('#create-tab-body');
      if (!body) return;
      if (b.dataset.createTab === 'photo') {
        body.innerHTML = `<p class="muted" style="font-size:13px">Set Photo tab — brand photo preview / upload (demo). Queue applies photo to created groups only.</p>
          <div style="width:120px;height:120px;border-radius:12px;border:1px dashed var(--color-border);display:grid;place-items:center;color:var(--color-text-muted)">Preview</div>`;
      } else {
        WF.openModal('jq-view', { jobId: WF_STATE.modal.payload.jobId });
      }
    }));
    $('#save-brand')?.addEventListener('click', () => {
      const name = $('#new-brand-name')?.value?.trim().toUpperCase();
      if (!name) return;
      WF_STATE.brands.push({
        id: 'b-' + name.toLowerCase(), brandName: name, brandLabel: name, accountCount: 0,
        standardGroupCountByPlatform: { whatsapp: 0, telegram: 0 },
        stock: { active: 0, ready: 0, recycle: 0, review: 0, other: 0 }, avgNd: 0, toPrep: 0, accounts: [],
      });
      WF_DATA.masterGroups[name] = [];
      WF.toast('Brand added (demo)');
      WF.closeModal();
      renderPage();
    });
    $('#save-account')?.addEventListener('click', () => {
      const brandName = $('#save-account').dataset.brand;
      const brand = WF_STATE.brands.find((b) => b.brandName === brandName);
      if (!brand) return;
      brand.accounts.push({
        id: 'a-' + Date.now(),
        platform: $('#new-acc-plat').value,
        accountName: $('#new-acc-name').value || 'New Account',
        phoneNumber: $('#new-acc-phone').value || '',
        brandName,
        status: 'logout',
        locationDevice: $('#new-acc-loc').value,
        groupsCurrent: 0, groupsTotal: brand.standardGroupCountByPlatform.whatsapp || 0,
        joinedInMaster: 0, adminCurrent: 0, adminTotal: brand.standardGroupCountByPlatform.whatsapp || 0,
        sessionStatus: 'invalid', syncState: 'pending', actionProcess: null, isMisaligned: true, lastSyncAt: null, scrapeProgress: null,
      });
      WF.toast('Account added (demo)');
      WF.closeModal();
      renderPage();
    });
    $$('[data-job-run]').forEach((b) => b.addEventListener('click', () => {
      const job = WF_STATE.jobs.find((j) => j.id === b.dataset.jobRun);
      if (job) { job.status = 'running'; setTimeout(() => { job.status = 'completed'; job.remark = 'Retry completed (demo)'; renderPage(); }, 1000); }
    }));
  }

  function applyHash() {
    const raw = (location.hash || '#/account').replace(/^#\/?/, '');
    const [page] = raw.split('/');
    const allowed = ['account', 'operations', 'settings'];
    if (page === 'settings' && !WF.isAdmin) {
      WF_STATE.page = 'account';
      location.hash = '#/account';
      return;
    }
    if (allowed.includes(page)) WF_STATE.page = page;
  }

  function setHashFromState() {
    let h = '#/' + WF_STATE.page;
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  function bindShell() {
    $('#btn-toggle-sidebar')?.addEventListener('click', () => {
      WF_STATE.sidebarCollapsed = !WF_STATE.sidebarCollapsed;
      renderShell();
    });
    $$('.nav-item[data-nav]').forEach((el) => el.addEventListener('click', (e) => {
      e.preventDefault();
      if (el.dataset.nav === 'settings') {
        if (!WF.isAdmin) { WF.toast('Settings is admin-only'); return; }
        WF_STATE.page = 'settings';
      } else {
        WF_STATE.page = 'account';
      }
      setHashFromState();
      renderShell();
    }));
    $('#btn-logout')?.addEventListener('click', () => WF.logout());
    $$('.monitoring-tab-btn').forEach((btn) => btn.addEventListener('click', () => {
      WF_STATE.page = btn.dataset.tab;
      setHashFromState();
      renderShell();
    }));
    $('#btn-refresh')?.addEventListener('click', () => {
      WF_STATE.refreshing = true;
      const btn = $('#btn-refresh');
      btn?.classList.add('is-spinning');
      setTimeout(() => {
        WF_STATE.refreshing = false;
        btn?.classList.remove('is-spinning');
        WF.toast('Refreshed (demo data)');
        renderPage();
      }, 700);
    });
    $('#role-select')?.addEventListener('change', (e) => {
      WF.setRole(e.target.value);
      if (!WF.isAdmin && WF_STATE.page === 'settings') WF_STATE.page = 'account';
      setHashFromState();
      renderShell();
      WF.toast('Role: ' + e.target.value);
    });
    window.addEventListener('hashchange', () => {
      applyHash();
      renderShell();
    });
  }

  window.WF_UI = { renderShell, renderModal, renderToast, renderPage };

  document.addEventListener('DOMContentLoaded', () => {
    if (document.body.dataset.page === 'app') {
      WF.requireAuth();
      applyHash();
      bindShell();
      setHashFromState();
      renderShell();
      clockTick();
      setInterval(clockTick, 1000);
    }
  });
})();

  </script>
</body>
</html>
