name: Repair Windows release asset

# Otomatis saat push trigger file — pakai secrets.GITHUB_TOKEN (bukan GH_TOKEN lokal).
on:
  push:
    branches: [main]
    paths:
      - '.github/REPAIR_RELEASE_V1.0.19'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (contoh v1.0.19)'
        required: true
        type: string
        default: v1.0.19

permissions:
  contents: write

jobs:
  repair-win:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      REPAIR_TAG: ${{ github.event_name == 'push' && 'v1.0.19' || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      - name: Prepare winCodeSign cache
        shell: pwsh
        run: ./scripts/prepare-win-codesign-cache.ps1

      - name: Write org .env
        shell: bash
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then
            echo "::error::ORG_ENV_FILE secret kosong"
            exit 1
          fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs

      - run: npm run build:installer:win

      - run: node scripts/prepare-github-release-assets.mjs release

      - name: Upload .exe + latest.yml (clobber)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="$REPAIR_TAG"
          EXE=$(ls release/Resource.Management.Setup.*.exe | head -1)
          test -f "$EXE"
          node scripts/validate-release-upload.mjs release
          gh release upload "$TAG" "$EXE" release/latest.yml --clobber
          echo "Selesai: $TAG — auto-update Windows normal lagi."
