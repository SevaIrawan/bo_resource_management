name: Release multi-platform

# Anda: naikkan version → git push main
# GitHub Actions (tanpa GH_TOKEN Anda): build Win+Mac+Linux → publish Release → tim auto-update
# GH_TOKEN di PowerShell hanya untuk publish lokal Windows: npm run publish:github
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Paksa build ulang meski release sudah ada'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Perlu rilis baru?
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG sudah ada — skip."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Akan build + publish $TAG"
          fi

  build-win:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Write org .env from secret
        shell: bash
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -z "$ORG_ENV_FILE" ]; then exit 0; fi
          echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
          node scripts/validate-org-env.mjs
      - run: npm run build:installer:win
      - uses: actions/upload-artifact@v4
        with:
          name: release-win
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

  build-mac:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Write org .env from secret
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -n "$ORG_ENV_FILE" ]; then
            echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
            node scripts/validate-org-env.mjs
          fi
      - run: npm run build:installer:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CSC_FOR_PULL_REQUEST: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml

  build-linux:
    needs: gate
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: 'true'
      PYTHON: python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 fuse libgtk-3-0 libnss3
      - run: npm ci
      - name: Write org .env from secret
        env:
          ORG_ENV_FILE: ${{ secrets.ORG_ENV_FILE }}
        run: |
          if [ -n "$ORG_ENV_FILE" ]; then
            echo "$ORG_ENV_FILE" | tr -d '\n\r ' | base64 -d > .env
            node scripts/validate-org-env.mjs
          fi
      - run: npm run build:installer:linux
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/latest-linux.yml

  publish:
    needs: [gate, build-win, build-mac, build-linux]
    if: needs.gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge assets
        run: |
          set -e
          mkdir -p release
          for dir in artifacts/release-win artifacts/release-mac artifacts/release-linux; do
            [ -d "$dir" ] && cp -v "$dir"/* release/ 2>/dev/null || true
          done
          ls -la release/
          test -f release/latest.yml
          test -f release/latest-mac.yml
          test -f release/latest-linux.yml
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.gate.outputs.tag }}
          name: Resource Management ${{ needs.gate.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
